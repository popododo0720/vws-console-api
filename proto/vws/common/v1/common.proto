syntax = "proto3";

package vws.common.v1;

option go_package = "github.com/popododo0720/vws-console-api/internal/backend/grpcclient/internal/pb/commonv1;commonv1";

// Scope is the account a call is limited to.
message Scope {
  string account_id = 1;
}

// Mutation is the idempotency identity of one long-running call.
message Mutation {
  Scope scope = 1;
  string key = 2;
  string fingerprint = 3;
}

// Target names one resource on an operation.
message Target {
  string kind = 1;
  string id = 2;
}

// Operation is the poll record for a long-running call.
message Operation {
  string id = 1;
  string action = 2;
  string state = 3;
  repeated Target targets = 4;
  string error_code = 5;
  string error_message = 6;
  string create_time = 7;
  string update_time = 8;
}

// Failure is attached to a gRPC status when the call fails.
// code is the resource.Code name.
message Failure {
  string code = 1;
  string kind = 2;
  string id = 3;
  string field = 4;
  string message = 5;
}

message GetOperationRequest {
  Scope scope = 1;
  string operation_id = 2;
}

message Page {
  int32 page_size = 1;
  string page_token = 2;
}
