syntax = "proto3";

package vws.compute.v1;

import "vws/common/v1/common.proto";

option go_package = "github.com/popododo0720/vws-console-api/internal/backend/grpcclient/internal/pb/computev1;computev1";

service Compute {
  rpc RunInstances(RunInstancesRequest) returns (InstancesAccepted);
  rpc StopInstances(StopInstancesRequest) returns (StateChangesAccepted);
  rpc DescribeInstances(DescribeInstancesRequest) returns (DescribeInstancesResponse);
  rpc GetOperation(vws.common.v1.GetOperationRequest) returns (vws.common.v1.Operation);
}

message Instance {
  string instance_id = 1;
  string reservation_id = 2;
  string owner_id = 3;
  string state = 4;
  string image_id = 5;
  string instance_type = 6;
  string subnet_id = 7;
  string zone = 8;
  string private_ip = 9;
  map<string, string> tags = 10;
}

message RunInstancesRequest {
  vws.common.v1.Mutation mutation = 1;
  string image_id = 2;
  string instance_type = 3;
  string subnet_id = 4;
  int32 count = 5;
  map<string, string> tags = 6;
}

message InstancesAccepted {
  vws.common.v1.Operation operation = 1;
  repeated Instance instances = 2;
}

message StopInstancesRequest {
  vws.common.v1.Mutation mutation = 1;
  repeated string instance_ids = 2;
}

message InstanceStateChange {
  string instance_id = 1;
  string owner_id = 2;
  string previous_state = 3;
  string current_state = 4;
}

message StateChangesAccepted {
  vws.common.v1.Operation operation = 1;
  repeated InstanceStateChange changes = 2;
}

message DescribeInstancesRequest {
  vws.common.v1.Scope scope = 1;
  repeated string instance_ids = 2;
  repeated string states = 3;
  vws.common.v1.Page page = 4;
}

message DescribeInstancesResponse {
  repeated Instance instances = 1;
  string next_page_token = 2;
}
