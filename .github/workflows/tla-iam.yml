# Model-checks docs/formal/iamauth.tla (IAM authorize, then read or write,
# #373) when the spec or the code it models changes. See
# docs/formal/iamauth.md.
name: tla-iam

on:
  pull_request:
    paths:
      - docs/formal/iamauth.*
      - scripts/tla-iam.sh
      - scripts/tla-detach.sh
      - .github/workflows/tla-iam.yml
      - internal/iam/authorized.go
      - internal/surface/iamquery/iamquery.go
      - internal/surface/iamquery/actions.go
      - internal/backend/grpcclient/iamclient/**
  push:
    branches: [main]
    paths:
      - docs/formal/iamauth.*
      - scripts/tla-iam.sh
      - scripts/tla-detach.sh
      - .github/workflows/tla-iam.yml
      - internal/iam/authorized.go
      - internal/surface/iamquery/iamquery.go
      - internal/surface/iamquery/actions.go
      - internal/backend/grpcclient/iamclient/**

permissions:
  contents: read

concurrency:
  group: tla-iam-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iam:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # scripts/tla-iam.sh reads the jar pin from scripts/tla-detach.sh.
      - id: pin
        run: grep -E '^TLA_SHA256=[0-9a-f]{64}$' scripts/tla-detach.sh >>"$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vws
          key: tla2tools-${{ steps.pin.outputs.TLA_SHA256 }}
      - name: TLC passes the real design, fails every seeded bug and each known finding
        run: scripts/tla-iam.sh
