# Lint and test only. The image is published by publish.yml; no deployment manifests live here.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Common golangci-lint baseline (vws-deploy .github/golangci-common.yml, vws-deploy#300).
  # fetch-depth 0 gives new-from-merge-base the origin/main history it compares against.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: guard-agents.sh rejects bad inputs
        run: scripts/guard-agents.sh selftest
      # This repo's own guard checks. The shared vws-deploy pr-hygiene job that repo-guard.yml calls does not
      # run them, so they stay here under the required lint check.
      - name: AGENTS.md has the /correct loop, incident form and label (vws-deploy#448)
        run: scripts/guard.sh correct
      - name: guard.sh fails on an empty /correct loop section
        run: scripts/guard_test.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true
      - name: Lint
        run: golangci-lint run --timeout=5m ./...
      - name: Format (gofumpt, goimports)
        run: golangci-lint fmt --diff

  # setup-go v6 installs the go.mod toolchain line itself. Under v5 the go
  # command fetched that toolchain into the module cache first, and the cache
  # restore then failed on the existing files, so every run built cold (#200).
  # This job keeps its own cache: the shared setup-go key is saved by whichever
  # job ends first, and that is never the one holding the -race build.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-race-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-race-${{ runner.os }}-
      - name: go.mod and go.sum are tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - name: Architecture rules and Judgment count
        run: scripts/guard-agents.sh archtest
      - name: Fetch kube-apiserver and etcd for envtest
        run: |
          base=https://github.com/kubernetes-sigs/controller-tools/releases/download/envtest-v1.37.0
          curl -fsSL -o "$RUNNER_TEMP/envtest.tgz" "$base/envtest-v1.37.0-linux-amd64.tar.gz"
          # Pinned here, not fetched from the release, so a replaced release fails.
          sum=1d1c453633b72c161a5d5a886cde7ac850be1a2ac796a9e1d4ffacacc64868295bdd2d57aa66cd0c158f5ce510f5dfe3fbc61ac21bd3dcfb875bd70658aa663a
          echo "$sum  $RUNNER_TEMP/envtest.tgz" | sha512sum -c -
          mkdir -p "$RUNNER_TEMP/envtest"
          tar -xzf "$RUNNER_TEMP/envtest.tgz" -C "$RUNNER_TEMP/envtest" --strip-components=2
          echo "KUBEBUILDER_ASSETS=$RUNNER_TEMP/envtest" >> "$GITHUB_ENV"
      - run: go test -race -count=1 ./...
      - name: Save the build cache from main
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-race-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  # e2e reads the test job's cache: its go vet leaves the plain build that
  # e2e/run.sh links, and the shared setup-go cache saved by lint has none.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-race-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-race-${{ runner.os }}-
      - run: pip install -r e2e/requirements.txt
      - name: aws CLI v2 for the IAM, STS and DetachVolume CLI steps
        run: aws --version
      - run: e2e/run.sh
        env:
          VWS_E2E_STRICT: "1"

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no image assets
        run: |
          imgs="$(git ls-files '*.png' '*.jpg' '*.jpeg' '*.gif' '*.svg' '*.ico' '*.webp')"
          if [ -n "$imgs" ]; then
            echo "image files are not allowed:"
            echo "$imgs"
            exit 1
          fi
      - name: no deployment manifests
        run: |
          hits="$(git ls-files | grep -E '(^|/)(Dockerfile|docker-compose\.ya?ml|Chart\.yaml)$|(^|/)(helm|k8s|deploy)/' || true)"
          if [ -n "$hits" ]; then
            echo "deployment files are not allowed:"
            echo "$hits"
            exit 1
          fi
