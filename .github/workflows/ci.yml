# Lint and test only. This repository ships no deployment configuration.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard-agents.sh rejects bad inputs
        run: scripts/guard-agents.sh selftest
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go.mod and go.sum are tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: pip install -r e2e/requirements.txt
      - run: e2e/run.sh
        env:
          VWS_E2E_STRICT: "1"

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no image assets
        run: |
          imgs="$(git ls-files '*.png' '*.jpg' '*.jpeg' '*.gif' '*.svg' '*.ico' '*.webp')"
          if [ -n "$imgs" ]; then
            echo "image files are not allowed:"
            echo "$imgs"
            exit 1
          fi
      - name: no deployment manifests
        run: |
          hits="$(git ls-files | grep -E '(^|/)(Dockerfile|docker-compose\.ya?ml|Chart\.yaml)$|(^|/)(helm|k8s|deploy)/' || true)"
          if [ -n "$hits" ]; then
            echo "deployment files are not allowed:"
            echo "$hits"
            exit 1
          fi
