# Common baseline: vws-deploy .github/golangci-common.yml (vws-deploy#300). Existing lll findings
# are fixed in a follow-up; until then new-from-merge-base holds changed lines to the baseline.
# golangci-lint v2. Each architectural rule in AGENTS.md that a linter can
# check is checked here. The rule names below are cited in that table.
version: "2"

run:
  go: "1.26"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - gochecknoglobals
    - gocritic
    - govet
    - ineffassign
    - lll
    - misspell
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - revive
    - sloglint
    - staticcheck
    - tagliatelle
    - unconvert
    - unused
    - usestdlibvars
    - wrapcheck
  settings:
    lll:
      line-length: 120
      tab-width: 1
    errcheck:
      check-type-assertions: true
      check-blank: true
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    sloglint:
      no-mixed-args: true
      attr-only: true
      context: all
      static-msg: true
      key-naming-case: snake
    wrapcheck:
      # The first entries are the linter defaults. ctx.Err() and a gRPC
      # status are returned as they are: they already are the error.
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - (context.Context).Err()
        - status.Error(
        - (*google.golang.org/grpc/internal/status.Status).Err()
      ignore-package-globs:
        - github.com/popododo0720/vws-console-api/internal/*
    depguard:
      rules:
        surfaces-use-the-kernel:
          files:
            - "**/internal/surface/**"
            - "!**/internal/surface/regionapi/*.go"
            - "!$test"
          deny:
            - pkg: github.com/popododo0720/vws-console-api/internal/backend
              desc: surfaces reach backends only through internal/cloud
        model-is-a-leaf:
          files:
            - "**/internal/resource/**"
          deny:
            - pkg: github.com/popododo0720/vws-console-api/internal
              desc: internal/resource imports only the standard library
        kernel-knows-no-wire:
          files:
            - "**/internal/cloud/**"
          deny:
            - pkg: net/http
              desc: the kernel takes and returns resource types, never HTTP
            - pkg: github.com/popododo0720/vws-console-api/internal/surface
              desc: the kernel does not know which surface called it
            - pkg: github.com/popododo0720/vws-console-api/internal/sigv4
              desc: authentication happens before the kernel
        grpc-stays-in-grpcclient:
          files:
            - "$all"
            - "!**/internal/backend/grpcclient/**"
          deny:
            - pkg: google.golang.org/grpc
              desc: only internal/backend/grpcclient speaks gRPC
            - pkg: google.golang.org/protobuf
              desc: only internal/backend/grpcclient sees protobuf types
            - pkg: github.com/popododo0720/vws-proto
              desc: the resource API stays inside the gRPC client
            - pkg: cloud.google.com/go/longrunning
              desc: long-running types stay inside the gRPC client
            - pkg: google.golang.org/genproto
              desc: generated API types stay inside the gRPC client
        kube-stays-in-kubestore:
          files:
            - "$all"
            - "!**/internal/backend/launch/kubestore/**"
          deny:
            - pkg: k8s.io
              desc: only internal/backend/launch/kubestore speaks to the Kubernetes API
            - pkg: sigs.k8s.io
              desc: only internal/backend/launch/kubestore speaks to the Kubernetes API
        pve-stays-in-proxmox:
          files:
            - "$all"
            - "!**/internal/backend/proxmox/**"
            - "!**/cmd/pvefake/**"
          deny:
            - pkg: github.com/popododo0720/vws-console-api/internal/backend/proxmox/pveclient
              desc: PVE API types stay inside internal/backend/proxmox
        etcd-stays-in-etcdstore:
          files:
            - "$all"
            - "!**/internal/admin/store/etcdstore/**"
          deny:
            - pkg: go.etcd.io
              desc: only internal/admin/store/etcdstore speaks to etcd
    exhaustive:
      default-signifies-exhaustive: false
    tagliatelle:
      case:
        rules:
          json: camel
          # global.yaml keys follow the design's snake_case spelling (design 7.4).
          yaml: snake
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: receiver-naming
        - name: error-strings
        - name: context-as-argument
        - name: unexported-return
  exclusions:
    generated: lax
    rules:
      # Tests build fixtures from constant ids and close test servers.
      # Production code gets the full errcheck and wrapcheck rules.
      - path: _test\.go
        linters:
          - errcheck
          - gochecknoglobals
          - wrapcheck
      # vws-proto v0.23.0 deprecates these services for the Proxmox backend
      # (vws-proto#255). The retired grpc backend keeps them until it is removed.
      - path: internal/backend/grpcclient/
        linters:
          - staticcheck
        text: "SA1019: github.com/popododo0720/vws-proto/gen/go/vws/(compute|network|storage)/v1"
    paths:
      - third_party

issues:
  new-from-merge-base: origin/main
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party
  settings:
    goimports:
      local-prefixes:
        - github.com/popododo0720/vws-console-api
